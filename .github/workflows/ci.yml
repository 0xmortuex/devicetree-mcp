name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # Extra Python versions run on ubuntu only - there's no OS-specific
        # Python code, so the full cross product would just burn minutes.
        exclude:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install "ruff==0.16.0" "mypy==2.3.0" ".[test]"
      - run: ruff check src tests
      - run: mypy --strict src
      - run: pytest tests -v --ignore=tests/test_live.py

  real-tools:
    # The live paths: QEMU generating -M virt DTBs (aarch64, riscv64, GICv3)
    # and dtc compiling .dts with labels. Ubuntu's QEMU and dtc are older than
    # a dev machine's - print versions so a failure is easy to place.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-arm qemu-system-misc device-tree-compiler
      - run: qemu-system-aarch64 --version && qemu-system-riscv64 --version && dtc --version
      - run: pip install ".[test]"
      - name: live tests must not skip
        run: |
          pytest tests/test_live.py -v -rs | tee live.txt
          if grep -q SKIPPED live.txt; then echo "a live test skipped - the real tool path was not exercised"; exit 1; fi
      - run: pytest tests -v
