[project]
name = "devicetree-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents read, explain and check devicetrees (.dtb/.dts) - memory maps, interrupt routing, validation - from files or QEMU machines."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "0xmortuex" }]
requires-python = ">=3.10"
dependencies = ["mcp>=2.0.0"]
keywords = ["mcp", "devicetree", "dtb", "dts", "embedded", "linux", "zephyr", "u-boot", "osdev", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware",
]

[project.optional-dependencies]
test = ["pytest>=7", "anyio"]

[project.urls]
Homepage = "https://github.com/0xmortuex/devicetree-mcp"

[project.scripts]
devicetree-mcp = "devicetree_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devicetree_mcp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
